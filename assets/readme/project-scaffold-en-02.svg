<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><style>text{font-family:'Segoe UI','Noto Sans TC',Arial,sans-serif;fill:#132544}.muted{fill:#6d7f9d}.blue{fill:#1769ef}.title{font-size:66px;font-weight:800}.sub{font-size:30px}.h{font-size:32px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.card{fill:#fbfdff;stroke:#d6e5fb;stroke-width:2}.num{fill:#dcecff}</style><rect width="1200" height="1200" fill="#fff"/><rect x="58" y="54" rx="16" width="380" height="54" fill="#e6f1ff"/><text x="82" y="91" class="blue" font-family="Consolas" font-size="24">project-scaffold-skill</text><text x="735" y="88" class="muted" font-size="22">GitHub: kenming/project-scaffold-skill</text><text x="58" y="222" class="title">Core 1: <tspan class="blue">Project Rules</tspan></text><text x="58" y="282" class="sub muted">Define clear project rules for AI agents</text>
<rect x="45" y="360" rx="20" width="350" height="600" class="card"/><circle cx="95" cy="415" r="30" class="num"/><text x="83" y="427" class="blue h">1</text><text x="145" y="428" class="h">Main Rule File</text><circle cx="80" cy="505" r="6" class="blue"/><text x="105" y="514" class="body muted">AGENTS.md for Codex / Copilot</text><circle cx="80" cy="585" r="6" class="blue"/><text x="105" y="594" class="body muted">CLAUDE.md for Claude Code</text><circle cx="80" cy="665" r="6" class="blue"/><text x="105" y="674" class="body muted">Same Markdown structure, reusable content</text><rect x="110" y="760" width="220" height="140" rx="16" fill="#f1f6fd"/><text x="145" y="845" class="blue h">AGENTS.md</text>
<rect x="425" y="360" rx="20" width="350" height="600" class="card"/><circle cx="475" cy="415" r="30" class="num"/><text x="463" y="427" class="blue h">2</text><text x="525" y="428" class="h">Keep it short</text><circle cx="460" cy="520" r="6" class="blue"/><text x="485" y="529" class="body muted">Main rule file stays under ~100 lines</text><circle cx="460" cy="625" r="6" class="blue"/><text x="485" y="634" class="body muted">Put only shared principles in the main file</text><rect x="515" y="740" width="170" height="170" rx="20" fill="#f1f6fd"/><text x="555" y="840" class="blue" font-size="54">&lt;/&gt;</text>
<rect x="805" y="360" rx="20" width="350" height="600" class="card"/><circle cx="855" cy="415" r="30" class="num"/><text x="843" y="427" class="blue h">3</text><text x="905" y="428" class="h">Detailed Rules</text><text x="850" y="505" class="body muted">Put specific rules in separate files.</text><rect x="850" y="575" width="260" height="110" rx="16" fill="#f7fbff" stroke="#d6e5fb"/><text x="885" y="625" class="h" font-size="25">tech-stack.md</text><text x="885" y="655" class="muted small">framework and tooling rules</text><rect x="850" y="720" width="260" height="110" rx="16" fill="#f7fbff" stroke="#d6e5fb"/><text x="875" y="770" class="h" font-size="23">project-structure.md</text><text x="885" y="800" class="muted small">folders and file purposes</text>
