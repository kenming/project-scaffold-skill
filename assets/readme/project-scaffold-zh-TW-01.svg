<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}</style><rect width="1200" height="760" fill="#fff"/><rect x="44" y="32" width="322" height="45" rx="13" fill="#e6f0ff"/><text x="64" y="63" font-size="22" fill="#1769ef" font-weight="700">project-scaffold-skill</text><text x="783" y="62" font-size="19" fill="#6c809c" font-weight="400">GitHub: kenming/project-scaffold-skill</text><text x="45" y="150" font-size="54" fill="#1165e9" font-weight="700">專案腳手架</text><text x="45" y="196" font-size="25" fill="#647894" font-weight="400">為 AI 協作開發提供簡單、可調整的專案骨架</text><rect x="45" y="242" width="336" height="315" rx="18" fill="#f9fbff" stroke="#d4e4fa" stroke-width="2"/><circle cx="88" cy="290" r="25" fill="#d8e9ff"/><text x="79" y="298" font-size="26" fill="#1769ef" font-weight="700">1</text><text x="130" y="301" font-size="30" fill="#132544" font-weight="700">預覽</text><text x="72" y="356" font-size="22" fill="#5d718f" font-weight="400">先查看預設的</text><text x="72" y="387" font-size="22" fill="#5d718f" font-weight="400">專案結構樹</text><path d="M111 422 h52 l14 12 h140 v90 h-206z" fill="#6fa8fa"/><path d="M139 449 h142" stroke="#d5e7ff" stroke-width="8"/><rect x="433" y="242" width="336" height="315" rx="18" fill="#f9fbff" stroke="#d4e4fa" stroke-width="2"/><circle cx="476" cy="290" r="25" fill="#d8e9ff"/><text x="467" y="298" font-size="26" fill="#1769ef" font-weight="700">2</text><text x="518" y="301" font-size="30" fill="#132544" font-weight="700">調整</text><text x="460" y="356" font-size="22" fill="#5d718f" font-weight="400">新增、移除、改名</text><text x="460" y="387" font-size="22" fill="#5d718f" font-weight="400">或移動資料夾與文件</text><rect x="499" y="422" width="200" height="105" rx="14" fill="#e7f1ff" stroke="#bed8f6"/><path d="M521 448 h140 M521 476 h116 M521 504 h85" stroke="#5d9af2" stroke-width="11" stroke-linecap="round"/><rect x="821" y="242" width="336" height="315" rx="18" fill="#f9fbff" stroke="#d4e4fa" stroke-width="2"/><circle cx="864" cy="290" r="25" fill="#d8e9ff"/><text x="855" y="298" font-size="26" fill="#1769ef" font-weight="700">3</text><text x="906" y="301" font-size="30" fill="#132544" font-weight="700">生成</text><text x="848" y="356" font-size="22" fill="#5d718f" font-weight="400">確認最終結構</text><text x="848" y="387" font-size="22" fill="#5d718f" font-weight="400">並建立專案骨架</text><path d="M887 422 h64 l20 22 h118 v88 h-202z" fill="#64a0fa"/><circle cx="1052" cy="510" r="28" fill="#1769ef"/><path d="M1038 509l10 11 20-23" stroke="#fff" stroke-width="7" fill="none"/><text x="46" y="610" font-size="29" fill="#132544" font-weight="700">為什麼有幫助</text><rect x="45" y="629" width="336" height="54" rx="18" fill="#f9fbff" stroke="#d4e4fa" stroke-width="2"/><text x="63" y="666" font-size="23" fill="#203350" font-weight="700">清楚的起點</text><rect x="433" y="629" width="336" height="54" rx="18" fill="#f9fbff" stroke="#d4e4fa" stroke-width="2"/><text x="451" y="666" font-size="23" fill="#203350" font-weight="700">減少上下文漂移</text><rect x="821" y="629" width="336" height="54" rx="18" fill="#f9fbff" stroke="#d4e4fa" stroke-width="2"/><text x="839" y="666" font-size="23" fill="#203350" font-weight="700">便於長期維護</text><path d="M45 702h1110" stroke="#d5e0ed" stroke-width="2"/><text x="53" y="733" font-size="18" fill="#778aa5" font-weight="400">採用 Open Agent Skills 開放格式 · 支援相容的 AI Agent</text></svg>